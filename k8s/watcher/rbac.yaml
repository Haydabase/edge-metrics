apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-metrics-watcher
  namespace: edge-metrics
---
# Cluster-scoped because generate-categorize-rules.sh reads HTTPRoutes and
# Services across all namespaces (it resolves each route's backend Service's
# app.kubernetes.io/name label, which may live in any namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-metrics-watcher
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-metrics-watcher
subjects:
  - kind: ServiceAccount
    name: edge-metrics-watcher
    namespace: edge-metrics
roleRef:
  kind: ClusterRole
  name: edge-metrics-watcher
  apiGroup: rbac.authorization.k8s.io
---
# Scoped to just the collector's own ConfigMap/Deployment, which is all the
# watcher ever patches (see watcher/reconcile.js).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edge-metrics-watcher
  namespace: edge-metrics
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["edge-metrics-opentelemetry-collector"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["edge-metrics-opentelemetry-collector"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-metrics-watcher
  namespace: edge-metrics
subjects:
  - kind: ServiceAccount
    name: edge-metrics-watcher
    namespace: edge-metrics
roleRef:
  kind: Role
  name: edge-metrics-watcher
  apiGroup: rbac.authorization.k8s.io
