# Built and loaded into the kind cluster by `just demo-watcher` - never
# pushed to a registry, hence imagePullPolicy: Never.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-metrics-watcher
  namespace: edge-metrics
  labels:
    app.kubernetes.io/name: edge-metrics-watcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-metrics-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-metrics-watcher
    spec:
      serviceAccountName: edge-metrics-watcher
      containers:
        - name: watcher
          image: edge-metrics-watcher:local
          imagePullPolicy: Never
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # tsx (used since the categorize logic moved to TS - see
              # categorize/) has real one-time startup CPU cost (spinning up
              # its esbuild transform service), unlike plain `node` before
              # it. Confirmed live via /sys/fs/cgroup/cpu.stat that even
              # 500m gets ~85% of periods throttled on a loaded dev machine,
              # stretching a ~1s startup into 10+ minutes - so this needs
              # real headroom, not just a bump.
              cpu: "2"
              memory: 128Mi
