# kind cluster config for the edge-metrics demo.
#
# extraPortMappings bind fixed localhost ports straight through to NodePort
# Services inside the cluster, so nothing in this demo needs `kubectl
# port-forward` (see k8s/kind-nodeports.yaml for the matching Services).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30088
        hostPort: 8088
        protocol: TCP
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP
