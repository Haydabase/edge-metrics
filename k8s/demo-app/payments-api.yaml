apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: applications
  labels:
    app.kubernetes.io/name: payments-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          env:
            - name: SERVICE_NAME
              value: payments-api
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: nginx-config
          configMap:
            name: demo-app-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: applications
  labels:
    app.kubernetes.io/name: payments-api
spec:
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - port: 80
      targetPort: 8080
---
# Both the regular (Cloudflare-fronted) and illustrative mTLS hostnames route
# here, to demonstrate the mTLS-vs-TLS ingestion split (see gateway.yaml's
# comment) — real mTLS termination is Envoy Gateway's own feature, not
# something this route config does.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: payments-api
  namespace: applications
  annotations:
    sli.paybybank.example/product: Payments
spec:
  parentRefs:
    - name: paybybank-gw
      namespace: api-gateway
  hostnames:
    - api.paybybank.example
    - api.mtls.paybybank.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /payments
      backendRefs:
        - name: payments-api
          port: 80
