apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  namespace: applications
  labels:
    app.kubernetes.io/name: auth-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-server
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          env:
            - name: SERVICE_NAME
              value: auth-server
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: nginx-config
          configMap:
            name: demo-app-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: auth-server
  namespace: applications
  labels:
    app.kubernetes.io/name: auth-server
spec:
  selector:
    app.kubernetes.io/name: auth-server
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-server
  namespace: applications
  annotations:
    sli.paybybank.example/product: Auth
spec:
  parentRefs:
    - name: paybybank-gw
      namespace: api-gateway
  hostnames:
    - auth.paybybank.example
    - auth.mtls.paybybank.example
  rules:
    - matches:
        - path:
            type: Exact
            value: /connect/token
      backendRefs:
        - name: auth-server
          port: 80
