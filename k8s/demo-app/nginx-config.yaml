apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-nginx-config
  namespace: applications
data:
  default.conf.template: |
    server {
        listen 8080 default_server;
        server_name _;
        default_type application/json;

        location / {
            # add_header must live at this (unconditional) level, not inside one of
            # the ifs below - add_header inside an `if` only applies to a response
            # generated within that same if block, not to sibling if/return blocks.
            add_header pbb-meta $http_x_demo_pbb_meta always;

            if ($http_x_demo_status = 400) { return 400 '{"service":"${SERVICE_NAME}","status":400}\n'; }
            if ($http_x_demo_status = 401) { return 401 '{"service":"${SERVICE_NAME}","status":401}\n'; }
            if ($http_x_demo_status = 403) { return 403 '{"service":"${SERVICE_NAME}","status":403}\n'; }
            if ($http_x_demo_status = 404) { return 404 '{"service":"${SERVICE_NAME}","status":404}\n'; }
            if ($http_x_demo_status = 429) { return 429 '{"service":"${SERVICE_NAME}","status":429}\n'; }
            if ($http_x_demo_status = 500) { return 500 '{"service":"${SERVICE_NAME}","status":500}\n'; }
            if ($http_x_demo_status = 502) { return 502 '{"service":"${SERVICE_NAME}","status":502}\n'; }
            if ($http_x_demo_status = 503) { return 503 '{"service":"${SERVICE_NAME}","status":503}\n'; }
            if ($http_x_demo_status = 504) { return 504 '{"service":"${SERVICE_NAME}","status":504}\n'; }

            return 200 '{"service":"${SERVICE_NAME}","status":200}\n';
        }
    }
