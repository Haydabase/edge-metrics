apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api
  namespace: applications
  labels:
    app.kubernetes.io/name: data-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-api
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0
          args:
            - -text=data-api
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-api
  namespace: applications
  labels:
    app.kubernetes.io/name: data-api
spec:
  selector:
    app.kubernetes.io/name: data-api
  ports:
    - port: 80
      targetPort: 5678
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: data-api
  namespace: applications
  annotations:
    sli.paybybank.example/product: Data
spec:
  parentRefs:
    - name: paybybank-gw
      namespace: api-gateway
  hostnames:
    - api.paybybank.example
    - api.mtls.paybybank.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /connected-accounts
      backendRefs:
        - name: data-api
          port: 80
