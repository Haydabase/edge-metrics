# Extra NodePort Services exposing the demo on the fixed localhost ports kind
# maps in kind-config.yaml. Defined as plain Services (rather than relying on
# each chart's own service-type config, which varies by chart/version) that
# select the well-known labels each chart already applies, so this stays
# correct even if chart-native NodePort options drift between versions.
#
# Apply after the Envoy Gateway, collector, and kube-prometheus-stack installs
# (`kubectl apply -f k8s/kind-nodeports.yaml`).
#
# NOTE: the Envoy Gateway selector below assumes the standard
# `gateway.envoyproxy.io/owning-gateway-{name,namespace}` labels Envoy Gateway
# applies to the Envoy proxy Deployment/pods it manages for a given Gateway.
# If `kubectl get pods -n envoy-gateway-system --show-labels` shows different
# labels for your installed version, update the selector below to match.
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway-nodeport
  namespace: envoy-gateway-system
spec:
  type: NodePort
  selector:
    gateway.envoyproxy.io/owning-gateway-name: paybybank-gw
    gateway.envoyproxy.io/owning-gateway-namespace: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 10080
      nodePort: 30080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: edge-metrics-collector-nodeport
  namespace: edge-metrics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/instance: edge-metrics
  ports:
    - name: cloudflare
      port: 8088
      targetPort: 8088
      nodePort: 30088
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prom-stack
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
      protocol: TCP
